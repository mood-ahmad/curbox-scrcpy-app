name: CI

# Runs on every pull request and on demand. Uses no repository secrets and
# does not publish anything. A throwaway keystore is generated only so Gradle
# can sign debug builds; it is never uploaded.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [Fdroid, Full, Playstore]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4.2.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin
        run: |
          chmod +x gradlew
          ./gradlew compile${{ matrix.flavor }}DebugKotlin --stacktrace

  unit-tests:
    name: Unit tests (full flavor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4.2.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        # ScriptLanguageTest.matchesRegexSupportsCommonFlags fails upstream;
        # failures are reported but do not block the PR yet.
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

  lint:
    name: Lint (fdroid)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4.2.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Throwaway debug keystore
        run: |
          keytool -genkeypair -keystore app/curbox-release.jks -alias curbox \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass curbox123 -keypass curbox123 -dname "CN=CI"
      - name: Lint
        run: |
          chmod +x gradlew
          ./gradlew lintFdroidDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  emulator:
    name: Emulator smoke test (fdroid, API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4.2.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Throwaway debug keystore
        run: |
          keytool -genkeypair -keystore app/curbox-release.jks -alias curbox \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass curbox123 -keypass curbox123 -dname "CN=CI"
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew connectedFdroidDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
