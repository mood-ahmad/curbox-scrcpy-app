name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore curbox-release.jks \
            -alias curbox \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass curbox123 \
            -keypass curbox123 \
            -dname "CN=CurBox, OU=Personal, O=mood-ahmad, L=Cairo, S=Cairo, C=EG"

      - name: Base64 encode
        run: |
          base64 -w 0 curbox-release.jks > curbox-release.base64
          echo "Base64 file created, size:"
          wc -c curbox-release.base64

      - name: Upload Keystore and Base64
        uses: actions/upload-artifact@v4
        with:
          name: curbox-keystore
          path: |
            curbox-release.jks
            curbox-release.base64
          retention-days: 1
