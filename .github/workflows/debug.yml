name: Debug CI

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARIES_REPOSITORY: 'mood-ahmad/curbox-scrcpy-binaries'
  SCRCPY_RELEASE_TAG: 'binaries-v041'
  CLOUDFLARED_RELEASE_TAG: 'cloudflared-android-2026.10.5'
  CLOUDFLARED_EXPECTED_SHA256: 'b2980050c656458c4e3b1c35eda53d1c00d9b02edbb32ff55e37df318b5e657c'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          test -x gradlew

      # ============================================================
      # SOURCE / FOUNDATION GATES
      # ============================================================

      - name: Verify privileged foundation source files
        shell: bash
        run: |
          set -euo pipefail

          ROOT="app/src/main/java/neth/iecal/curbox/utils/privileged"

          test -s "$ROOT/PrivilegedBackend.kt"
          test -s "$ROOT/PrivilegedResult.kt"
          test -s "$ROOT/ShizukuBackend.kt"
          test -s "$ROOT/PrivilegedRunner.kt"

          grep -Fq \
            "interface PrivilegedBackend" \
            "$ROOT/PrivilegedBackend.kt"

          grep -Fq \
            "sealed class PrivilegedResult" \
            "$ROOT/PrivilegedResult.kt"

          grep -Fq \
            "object ShizukuBackend" \
            "$ROOT/ShizukuBackend.kt"

          grep -Fq \
            "object PrivilegedRunner" \
            "$ROOT/PrivilegedRunner.kt"

          echo "PASS: privileged foundation files exist"
          echo "PASS: privileged foundation declarations found"

      - name: Verify migrated privileged command call sites
        shell: bash
        run: |
          set -euo pipefail

          MONO="app/src/main/java/neth/iecal/curbox/utils/MonochromeTools.kt"
          SUSPEND="app/src/main/java/neth/iecal/curbox/utils/AppSuspendHelper.kt"
          PROTECTION="app/src/main/java/neth/iecal/curbox/utils/ServiceProtectionManager.kt"
          BLOCKER="app/src/main/java/neth/iecal/curbox/blockers/AppBlocker.kt"
          ONBOARDING="app/src/main/java/neth/iecal/curbox/ui/fragments/installation/onboarding/screens/OnboardingPermissionsFragment.kt"

          for file in \
            "$MONO" \
            "$SUSPEND" \
            "$PROTECTION" \
            "$BLOCKER" \
            "$ONBOARDING"
          do
            test -s "$file"

            grep -Fq \
              "PrivilegedRunner" \
              "$file"

            echo "PASS: PrivilegedRunner migration found in $file"
          done

          if grep -n \
            "ShizukuRunner.executeCommand" \
            "$MONO" \
            "$SUSPEND" \
            "$PROTECTION" \
            "$BLOCKER" \
            "$ONBOARDING"
          then
            echo "FAIL: direct ShizukuRunner command execution remains in a migrated file"
            exit 1
          fi

          echo "PASS: migrated files no longer execute commands directly through ShizukuRunner"

      - name: Verify Shizuku backend remains present
        shell: bash
        run: |
          set -euo pipefail

          RUNNER="app/src/main/java/neth/iecal/curbox/utils/ShizukuRunner.kt"
          BACKEND="app/src/main/java/neth/iecal/curbox/utils/privileged/ShizukuBackend.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"
          GRADLE="app/build.gradle.kts"

          test -s "$RUNNER"
          test -s "$BACKEND"

          grep -Fq \
            "ShizukuRunner.executeCommand" \
            "$BACKEND"

          grep -Fq \
            "rikka.shizuku.ShizukuProvider" \
            "$MANIFEST"

          grep -Fq \
            "implementation(libs.api)" \
            "$GRADLE"

          grep -Fq \
            "implementation(libs.provider)" \
            "$GRADLE"

          echo "PASS: existing Shizuku backend remains intact"

      # ============================================================
      # PREFLIGHT 1: Required secrets
      # ============================================================

      - name: Verify required CurBox secrets
        shell: bash
        env:
          BINARIES_TOKEN: ${{ secrets.BINARIES_TOKEN }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
          COMMAND_EMAIL: ${{ secrets.CURBOX_COMMAND_EMAIL }}
          COMMAND_PASSWORD: ${{ secrets.CURBOX_COMMAND_PASSWORD }}
          AUTHORIZED_SENDER: ${{ secrets.CURBOX_AUTHORIZED_COMMAND_SENDER }}
        run: |
          set -euo pipefail

          echo "===== CurBox secret presence check ====="

          fail=0

          check_secret() {
            name="$1"
            value="$2"

            if [ -z "$value" ]; then
              echo "FAIL: $name is missing"
              fail=1
            else
              echo "PASS: $name is present"
            fi
          }

          check_secret "BINARIES_TOKEN" "$BINARIES_TOKEN"
          check_secret "SMTP_EMAIL" "$SMTP_EMAIL"
          check_secret "SMTP_PASSWORD" "$SMTP_PASSWORD"
          check_secret "TARGET_EMAIL" "$TARGET_EMAIL"
          check_secret "CURBOX_COMMAND_EMAIL" "$COMMAND_EMAIL"
          check_secret "CURBOX_COMMAND_PASSWORD" "$COMMAND_PASSWORD"
          check_secret "CURBOX_AUTHORIZED_COMMAND_SENDER" "$AUTHORIZED_SENDER"

          if [ "$fail" -ne 0 ]; then
            echo "One or more required secrets are missing."
            exit 1
          fi

          echo "All required secrets are present."

      # ============================================================
      # PREFLIGHT 2: Network/DNS/TLS
      # ============================================================

      - name: Verify Gmail DNS and TLS endpoints
        shell: bash
        run: |
          set -euo pipefail

          echo "===== DNS ====="

          getent ahosts imap.gmail.com >/tmp/imap-dns.txt
          getent ahosts smtp.gmail.com >/tmp/smtp-dns.txt

          test -s /tmp/imap-dns.txt
          test -s /tmp/smtp-dns.txt

          echo "PASS: imap.gmail.com resolves"
          echo "PASS: smtp.gmail.com resolves"

          echo ""
          echo "===== TLS :993 ====="

          timeout 20 openssl s_client \
            -connect imap.gmail.com:993 \
            -servername imap.gmail.com \
            -brief \
            </dev/null \
            >/tmp/imap-tls.txt 2>&1

          grep -Eiq "Protocol|CONNECTION ESTABLISHED" /tmp/imap-tls.txt

          echo "PASS: IMAP TLS connection established"

          echo ""
          echo "===== TLS :465 ====="

          timeout 20 openssl s_client \
            -connect smtp.gmail.com:465 \
            -servername smtp.gmail.com \
            -brief \
            </dev/null \
            >/tmp/smtp-tls.txt 2>&1

          grep -Eiq "Protocol|CONNECTION ESTABLISHED" /tmp/smtp-tls.txt

          echo "PASS: SMTP TLS connection established"

      # ============================================================
      # PREFLIGHT 3: Real Gmail IMAP authentication
      # ============================================================

      - name: Verify Gmail IMAP authentication and INBOX
        shell: bash
        env:
          COMMAND_EMAIL: ${{ secrets.CURBOX_COMMAND_EMAIL }}
          COMMAND_PASSWORD: ${{ secrets.CURBOX_COMMAND_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import imaplib
          import os
          import ssl
          import sys

          host = "imap.gmail.com"
          port = 993

          email = os.environ["COMMAND_EMAIL"].strip()
          password = os.environ["COMMAND_PASSWORD"].strip()

          if not email or not password:
              print("FAIL: IMAP credentials are missing")
              sys.exit(1)

          print("IMAP_CONNECT_START")

          client = None

          try:
              context = ssl.create_default_context()

              client = imaplib.IMAP4_SSL(
                  host=host,
                  port=port,
                  ssl_context=context,
                  timeout=20
              )

              print("IMAP_TLS_CONNECTED")

              status, _ = client.login(email, password)

              if status != "OK":
                  raise RuntimeError(
                      f"IMAP login returned status={status}"
                  )

              print("IMAP_AUTH_OK")

              status, _ = client.select(
                  mailbox="INBOX",
                  readonly=True
              )

              if status != "OK":
                  raise RuntimeError(
                      f"INBOX select returned status={status}"
                  )

              print("IMAP_INBOX_OK")

              status, data = client.search(
                  None,
                  "UNSEEN"
              )

              if status != "OK":
                  raise RuntimeError(
                      f"UNSEEN search returned status={status}"
                  )

              ids = []

              has_unseen_data = bool(data) and bool(data[0])

              if has_unseen_data:
                  ids = data[0].split()

              print(
                  f"IMAP_UNSEEN_SEARCH_OK count={len(ids)}"
              )

              print("IMAP_PREFLIGHT_PASS")

          except Exception as exc:
              print(
                  "IMAP_PREFLIGHT_FAIL "
                  f"type={type(exc).__name__} "
                  f"reason={str(exc)[:300]}"
              )
              sys.exit(1)

          finally:
              if client is not None:
                  try:
                      client.logout()
                  except Exception:
                      pass
          PY

      # ============================================================
      # PREFLIGHT 4: Real Gmail SMTP authentication
      # ============================================================

      - name: Verify Gmail SMTP authentication
        shell: bash
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          import sys

          host = "smtp.gmail.com"
          port = 465

          email = os.environ["SMTP_EMAIL"].strip()
          password = os.environ["SMTP_PASSWORD"].strip()

          if not email or not password:
              print("FAIL: SMTP credentials are missing")
              sys.exit(1)

          server = None

          try:
              print("SMTP_CONNECT_START")

              context = ssl.create_default_context()

              server = smtplib.SMTP_SSL(
                  host=host,
                  port=port,
                  timeout=20,
                  context=context
              )

              print("SMTP_TLS_CONNECTED")

              code, _ = server.login(
                  email,
                  password
              )

              if code not in (235, 503):
                  raise RuntimeError(
                      f"SMTP login returned code={code}"
                  )

              print("SMTP_AUTH_OK")
              print("SMTP_PREFLIGHT_PASS")

          except Exception as exc:
              print(
                  "SMTP_PREFLIGHT_FAIL "
                  f"type={type(exc).__name__} "
                  f"reason={str(exc)[:300]}"
              )
              sys.exit(1)

          finally:
              if server is not None:
                  try:
                      server.quit()
                  except Exception:
                      pass
          PY

      # ============================================================
      # Runtime download
      # ============================================================

      - name: Cache downloaded runtime dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/curbox-cache
          key: curbox-runtime-v041-cloudflared-android-2026.10.5-v2

      - name: Download pinned Scrcpy runtime and signing key
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BINARIES_TOKEN }}
        run: |
          set -euo pipefail

          CACHE_ROOT="/tmp/curbox-cache"
          SCRCPY_CACHE="$CACHE_ROOT/scrcpy-v041"

          SCRCPY_ZIP="$SCRCPY_CACHE/cloudphone-binaries-v041.zip"
          KEYSTORE="$SCRCPY_CACHE/curbox-release.jks"

          mkdir -p "$SCRCPY_CACHE"

          if [ ! -s "$SCRCPY_ZIP" ]; then
            echo "Downloading pinned Scrcpy runtime..."

            gh release download "$SCRCPY_RELEASE_TAG" \
              --repo "$BINARIES_REPOSITORY" \
              --pattern "cloudphone-binaries-v041.zip" \
              --dir "$SCRCPY_CACHE"
          else
            echo "Using cached Scrcpy runtime."
          fi

          if [ ! -s "$KEYSTORE" ]; then
            echo "Downloading CurBox signing key..."

            gh release download "$SCRCPY_RELEASE_TAG" \
              --repo "$BINARIES_REPOSITORY" \
              --pattern "curbox-release.jks" \
              --dir "$SCRCPY_CACHE"
          else
            echo "Using cached CurBox signing key."
          fi

          test -s "$SCRCPY_ZIP"
          test -s "$KEYSTORE"

          echo "PASS: v0.4.1 runtime archive exists"
          echo "PASS: CurBox signing key exists"

          ls -lh "$SCRCPY_ZIP"

      # ============================================================
      # Cloudflared verification
      # ============================================================

      - name: Download verified Android cloudflared release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BINARIES_TOKEN }}
        run: |
          set -euo pipefail

          CACHE_ROOT="/tmp/curbox-cache"
          CLOUDFLARED_CACHE="$CACHE_ROOT/cloudflared-android-2026.10.5"

          CLOUDFLARED_BIN="$CLOUDFLARED_CACHE/cloudflared"
          CLOUDFLARED_SUMS="$CLOUDFLARED_CACHE/SHA256SUMS"
          CLOUDFLARED_INFO="$CLOUDFLARED_CACHE/build-info.txt"

          mkdir -p "$CLOUDFLARED_CACHE"

          if [ ! -s "$CLOUDFLARED_BIN" ] || \
             [ ! -s "$CLOUDFLARED_SUMS" ] || \
             [ ! -s "$CLOUDFLARED_INFO" ]; then

            rm -f \
              "$CLOUDFLARED_BIN" \
              "$CLOUDFLARED_SUMS" \
              "$CLOUDFLARED_INFO"

            gh release download "$CLOUDFLARED_RELEASE_TAG" \
              --repo "$BINARIES_REPOSITORY" \
              --pattern "cloudflared" \
              --pattern "SHA256SUMS" \
              --pattern "build-info.txt" \
              --dir "$CLOUDFLARED_CACHE"
          fi

          test -s "$CLOUDFLARED_BIN"
          test -s "$CLOUDFLARED_SUMS"
          test -s "$CLOUDFLARED_INFO"

          cd "$CLOUDFLARED_CACHE"

          sha256sum -c SHA256SUMS

          ACTUAL_SHA256="$(
            sha256sum cloudflared |
            awk '{print $1}'
          )"

          test "$ACTUAL_SHA256" = "$CLOUDFLARED_EXPECTED_SHA256"

          echo "PASS: cloudflared SHA-256 verified"

      - name: Verify Android cloudflared identity
        shell: bash
        run: |
          set -euo pipefail

          CACHE="/tmp/curbox-cache/cloudflared-android-2026.10.5"
          BIN="$CACHE/cloudflared"
          INFO="$CACHE/build-info.txt"

          file "$BIN" > /tmp/cf-file.txt
          readelf -h "$BIN" > /tmp/cf-elf.txt
          readelf -l "$BIN" > /tmp/cf-program.txt

          grep -Fq "ELF 64-bit" /tmp/cf-file.txt
          grep -Fq "ARM aarch64" /tmp/cf-file.txt
          grep -Fq "dynamically linked" /tmp/cf-file.txt
          grep -Fq "for Android 21" /tmp/cf-file.txt
          grep -Fq "AArch64" /tmp/cf-elf.txt
          grep -Fq "/system/bin/linker64" /tmp/cf-program.txt

          grep -Fq \
            "cloudflared version: 2026.10.5" \
            "$INFO"

          grep -Fq "CGO_ENABLED=1" "$INFO"
          grep -Fq "GOOS=android" "$INFO"
          grep -Fq "GOARCH=arm64" "$INFO"

          echo "PASS: Android cloudflared identity verified"

      # ============================================================
      # Prepare original v0.4.1 runtime
      # ============================================================

      - name: Prepare verified CurBox runtime assets
        shell: bash
        run: |
          set -euo pipefail

          SCRCPY_CACHE="/tmp/curbox-cache/scrcpy-v041"
          CLOUDFLARED_CACHE="/tmp/curbox-cache/cloudflared-android-2026.10.5"

          EXTRACT_ROOT="/tmp/extracted"
          SOURCE_ROOT="$EXTRACT_ROOT/cloudphone-v0.4.1"
          ANDROID_SOURCE="$SOURCE_ROOT/android"
          WEB_ASSETS_SOURCE="$SOURCE_ROOT/assets"

          TARGET_ROOT="app/src/main/assets/cloudphone"
          TARGET_CERTS="$TARGET_ROOT/certs"
          TARGET_ASSETS="$TARGET_ROOT/assets"

          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"

          unzip -q -o \
            "$SCRCPY_CACHE/cloudphone-binaries-v041.zip" \
            -d "$EXTRACT_ROOT"

          test -d "$SOURCE_ROOT"
          test -d "$ANDROID_SOURCE"
          test -d "$WEB_ASSETS_SOURCE"

          test -s "$ANDROID_SOURCE/cloudphone-agent"
          test -s "$ANDROID_SOURCE/webrtc-signaling"
          test -s "$ANDROID_SOURCE/libsys_core.so"
          test -d "$ANDROID_SOURCE/certs"

          rm -rf "$TARGET_ROOT"

          mkdir -p \
            "$TARGET_CERTS" \
            "$TARGET_ASSETS"

          cp "$ANDROID_SOURCE/cloudphone-agent" \
            "$TARGET_ROOT/cloudphone-agent"

          cp "$ANDROID_SOURCE/webrtc-signaling" \
            "$TARGET_ROOT/webrtc-signaling"

          cp "$ANDROID_SOURCE/libsys_core.so" \
            "$TARGET_ROOT/libsys_core.so"

          cp -a "$ANDROID_SOURCE/certs/." \
            "$TARGET_CERTS/"

          cp -a "$WEB_ASSETS_SOURCE/." \
            "$TARGET_ASSETS/"

          cp "$CLOUDFLARED_CACHE/cloudflared" \
            "$TARGET_ROOT/cloudflared"

          cp "$SCRCPY_CACHE/curbox-release.jks" \
            app/curbox-release.jks

          chmod 755 "$TARGET_ROOT/cloudflared"

          echo "PASS: original v0.4.1 runtime staged"

      # ============================================================
      # Guard against accidentally packaging recovered runtime
      # ============================================================

      - name: Verify original v0.4.1 runtime identity
        shell: bash
        run: |
          set -euo pipefail

          TARGET_ROOT="app/src/main/assets/cloudphone"

          test -s "$TARGET_ROOT/cloudphone-agent"
          test -s "$TARGET_ROOT/webrtc-signaling"
          test -s "$TARGET_ROOT/libsys_core.so"
          test -s "$TARGET_ROOT/cloudflared"

          test -d "$TARGET_ROOT/certs"
          test -d "$TARGET_ROOT/assets"

          SIGNALING_SIZE="$(
            stat -c '%s' "$TARGET_ROOT/webrtc-signaling"
          )"

          AGENT_SIZE="$(
            stat -c '%s' "$TARGET_ROOT/cloudphone-agent"
          )"

          echo "webrtc-signaling size=$SIGNALING_SIZE"
          echo "cloudphone-agent size=$AGENT_SIZE"

          test "$SIGNALING_SIZE" = "7209108"
          test "$AGENT_SIZE" = "11665556"

          if grep -RIl \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.woff' \
            --exclude='*.woff2' \
            "recovered-baseline" \
            "$TARGET_ROOT" \
            >/tmp/recovered-hits.txt 2>/dev/null; then

            echo "FAIL: recovered-baseline marker found:"
            cat /tmp/recovered-hits.txt
            exit 1
          fi

          echo "PASS: runtime matches expected v0.4.1 binary sizes"
          echo "PASS: no recovered-baseline marker detected"

      - name: Verify prepared CurBox runtime assets
        shell: bash
        run: |
          set -euo pipefail

          TARGET_ROOT="app/src/main/assets/cloudphone"

          test -s app/curbox-release.jks

          test -s "$TARGET_ROOT/cloudphone-agent"
          test -s "$TARGET_ROOT/webrtc-signaling"
          test -s "$TARGET_ROOT/libsys_core.so"
          test -s "$TARGET_ROOT/cloudflared"

          test -d "$TARGET_ROOT/certs"
          test -d "$TARGET_ROOT/assets"

          find "$TARGET_ROOT/certs" \
            -type f \
            -size +0c \
            -print \
            -quit |
            grep -q .

          find "$TARGET_ROOT/assets" \
            -type f \
            -size +0c \
            -print \
            -quit |
            grep -q .

          CLOUDFLARED_SHA256="$(
            sha256sum "$TARGET_ROOT/cloudflared" |
            awk '{print $1}'
          )"

          test \
            "$CLOUDFLARED_SHA256" = \
            "$CLOUDFLARED_EXPECTED_SHA256"

          echo "PASS: prepared runtime assets verified"

      # ============================================================
      # COMPILE / LINT GATES
      #
      # F-Droid intentionally excludes the Supabase implementation.
      # Supabase-specific unit tests therefore do not belong to the
      # F-Droid source-set gate.
      # ============================================================

      - name: Compile Fdroid Debug Kotlin
        shell: bash
        env:
          CURBOX_SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          CURBOX_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CURBOX_TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
          CURBOX_COMMAND_EMAIL: ${{ secrets.CURBOX_COMMAND_EMAIL }}
          CURBOX_COMMAND_PASSWORD: ${{ secrets.CURBOX_COMMAND_PASSWORD }}
          CURBOX_AUTHORIZED_COMMAND_SENDER: ${{ secrets.CURBOX_AUTHORIZED_COMMAND_SENDER }}
        run: |
          set -euo pipefail

          ./gradlew \
            compileFdroidDebugKotlin \
            --stacktrace

      - name: Run Fdroid Debug lint
        shell: bash
        env:
          CURBOX_SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          CURBOX_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CURBOX_TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
          CURBOX_COMMAND_EMAIL: ${{ secrets.CURBOX_COMMAND_EMAIL }}
          CURBOX_COMMAND_PASSWORD: ${{ secrets.CURBOX_COMMAND_PASSWORD }}
          CURBOX_AUTHORIZED_COMMAND_SENDER: ${{ secrets.CURBOX_AUTHORIZED_COMMAND_SENDER }}
        run: |
          set -euo pipefail

          ./gradlew \
            lintFdroidDebug \
            --stacktrace

      # ============================================================
      # Build
      # ============================================================

      - name: Build Fdroid Debug APK
        shell: bash
        env:
          CURBOX_SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          CURBOX_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CURBOX_TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
          CURBOX_COMMAND_EMAIL: ${{ secrets.CURBOX_COMMAND_EMAIL }}
          CURBOX_COMMAND_PASSWORD: ${{ secrets.CURBOX_COMMAND_PASSWORD }}
          CURBOX_AUTHORIZED_COMMAND_SENDER: ${{ secrets.CURBOX_AUTHORIZED_COMMAND_SENDER }}
        run: |
          set -euo pipefail

          ./gradlew \
            assembleFdroidDebug \
            --stacktrace

      # ============================================================
      # APK verification
      # ============================================================

      - name: Locate unsigned Fdroid Debug APK
        id: unsigned_apk
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find app/build/outputs/apk/fdroid/debug \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "FAIL: expected exactly one APK."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          APK_PATH="${APKS[0]}"

          test -s "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          echo "PASS: unsigned APK exists and ZIP structure is valid"

      - name: Verify required runtime inside unsigned APK
        shell: bash
        env:
          APK_PATH: ${{ steps.unsigned_apk.outputs.apk_path }}
        run: |
          set -euo pipefail

          for path in \
            assets/cloudphone/cloudphone-agent \
            assets/cloudphone/webrtc-signaling \
            assets/cloudphone/libsys_core.so \
            assets/cloudphone/cloudflared
          do
            unzip -Z1 "$APK_PATH" |
              grep -Fxq "$path"

            echo "PASS: APK contains $path"
          done

          unzip -p \
            "$APK_PATH" \
            assets/cloudphone/webrtc-signaling \
            > /tmp/apk-signaling

          unzip -p \
            "$APK_PATH" \
            assets/cloudphone/cloudphone-agent \
            > /tmp/apk-agent

          test "$(
            stat -c '%s' /tmp/apk-signaling
          )" = "7209108"

          test "$(
            stat -c '%s' /tmp/apk-agent
          )" = "11665556"

          echo "PASS: APK contains original v0.4.1 runtime identity"

      - name: Verify Android cloudflared inside unsigned APK
        shell: bash
        env:
          APK_PATH: ${{ steps.unsigned_apk.outputs.apk_path }}
        run: |
          set -euo pipefail

          EXTRACTED_BIN="/tmp/apk-cloudflared"

          unzip -p \
            "$APK_PATH" \
            assets/cloudphone/cloudflared \
            > "$EXTRACTED_BIN"

          test -s "$EXTRACTED_BIN"

          EMBEDDED_SHA256="$(
            sha256sum "$EXTRACTED_BIN" |
            awk '{print $1}'
          )"

          test \
            "$EMBEDDED_SHA256" = \
            "$CLOUDFLARED_EXPECTED_SHA256"

          echo "PASS: APK cloudflared SHA-256 verified"

      # ============================================================
      # Signing
      # ============================================================

      - name: Locate Android signing tools
        id: android_tools
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"

          test -n "$BUILD_TOOLS_DIR"

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"
          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"

      - name: Prepare align and sign Debug APK
        shell: bash
        env:
          APKSIGNER: ${{ steps.android_tools.outputs.apksigner }}
          ZIPALIGN: ${{ steps.android_tools.outputs.zipalign }}
          APK_PATH: ${{ steps.unsigned_apk.outputs.apk_path }}
        run: |
          set -euo pipefail

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$APK_PATH" \
            curbox-aligned-debug.apk

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            curbox-aligned-debug.apk

          "$APKSIGNER" sign \
            --ks app/curbox-release.jks \
            --ks-key-alias curbox \
            --ks-pass pass:curbox123 \
            --key-pass pass:curbox123 \
            --out curbox-latest-debug.apk \
            curbox-aligned-debug.apk

          test -s curbox-latest-debug.apk

          rm -f curbox-aligned-debug.apk

      - name: Verify final APK integrity and signature
        shell: bash
        env:
          APKSIGNER: ${{ steps.android_tools.outputs.apksigner }}
        run: |
          set -euo pipefail

          unzip -t curbox-latest-debug.apk >/dev/null

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            curbox-latest-debug.apk

          echo "PASS: final APK ZIP structure verified"
          echo "PASS: final APK signature verified"

          sha256sum curbox-latest-debug.apk

      - name: Verify original runtime inside final signed APK
        shell: bash
        run: |
          set -euo pipefail

          unzip -p \
            curbox-latest-debug.apk \
            assets/cloudphone/webrtc-signaling \
            > /tmp/final-signaling

          unzip -p \
            curbox-latest-debug.apk \
            assets/cloudphone/cloudphone-agent \
            > /tmp/final-agent

          test "$(
            stat -c '%s' /tmp/final-signaling
          )" = "7209108"

          test "$(
            stat -c '%s' /tmp/final-agent
          )" = "11665556"

          FINAL_CF_SHA256="$(
            unzip -p \
              curbox-latest-debug.apk \
              assets/cloudphone/cloudflared |
              sha256sum |
              awk '{print $1}'
          )"

          test \
            "$FINAL_CF_SHA256" = \
            "$CLOUDFLARED_EXPECTED_SHA256"

          echo "PASS: final APK contains original v0.4.1 runtime"
          echo "PASS: final APK cloudflared verified"

      # ============================================================
      # Upload
      # ============================================================

      - name: Upload verified APK to Debug Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="debug-latest"
          APK_NAME="curbox-latest-debug.apk"

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then

            gh release delete-asset "$TAG" \
              "$APK_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              2>/dev/null || true

            gh release upload "$TAG" \
              "$APK_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              "$APK_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "CurBox Latest Debug" \
              --notes "Preflight-verified development build." \
              --prerelease
          fi

          echo "PASS: APK uploaded"

      # ============================================================
      # Summary
      # ============================================================

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CurBox Debug CI"
            echo ""
            echo "### Foundation verification"
            echo ""
            echo "- PrivilegedBackend source exists"
            echo "- PrivilegedResult source exists"
            echo "- ShizukuBackend source exists"
            echo "- PrivilegedRunner source exists"
            echo "- Migrated command callers use PrivilegedRunner"
            echo "- Migrated callers do not directly execute through ShizukuRunner"
            echo "- Existing Shizuku backend/provider/dependencies remain present"
            echo ""
            echo "### Compile / quality gates"
            echo ""
            echo "- Fdroid Debug Kotlin compilation"
            echo "- Fdroid Debug lint"
            echo "- Fdroid Debug APK assembly"
            echo ""
            echo "### Flavor note"
            echo ""
            echo "- Supabase-specific unit tests are not run against F-Droid because this flavor intentionally excludes the Supabase implementation"
            echo ""
            echo "### Existing runtime verification"
            echo ""
            echo "- Required secrets are present"
            echo "- Gmail IMAP DNS/TLS"
            echo "- Gmail IMAP authentication"
            echo "- Gmail INBOX access"
            echo "- Gmail UNSEEN search"
            echo "- Gmail SMTP DNS/TLS"
            echo "- Gmail SMTP authentication"
            echo "- Original ScrcpyOverWebRTC v0.4.1 runtime"
            echo "- Android cloudflared identity and SHA-256"
            echo "- Runtime presence inside APK"
            echo "- APK ZIP integrity"
            echo "- APK signing"
            echo "- Runtime identity after final signing"
            echo ""
            echo "### Physical-device checks still required"
            echo ""
            echo "- Existing Shizuku permission flow"
            echo "- WRITE_SECURE_SETTINGS grant through Shizuku"
            echo "- Grayscale"
            echo "- AppBlocker force-stop"
            echo "- Service Protection self-heal"
            echo "- Device Owner flow"
            echo "- Agent launch"
            echo "- Signaling launch"
            echo "- WebRTC streaming/control"
            echo "- Quick Tunnel runtime lifetime"
            echo "- Email command execution inside the Android app"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
