name: Debug CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache downloaded binaries
        uses: actions/cache@v4
        with:
          path: /tmp/curbox-cache
          key: curbox-binaries-v041-cloudflared-v1

      - name: Download Scrcpy binaries, keystore and cloudflared
        env:
          GH_TOKEN: ${{ secrets.BINARIES_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/curbox-cache
          mkdir -p /tmp/extracted

          if [ ! -f /tmp/curbox-cache/cloudflared ]; then
            echo "Downloading binaries..."

            gh release download binaries-v041 \
              --repo mood-ahmad/curbox-scrcpy-binaries \
              --pattern "cloudphone-binaries-v041.zip" \
              --pattern "curbox-release.jks" \
              --pattern "cloudflared" \
              --dir /tmp/curbox-cache/
          else
            echo "Using cached binaries."
          fi

          unzip -o \
            /tmp/curbox-cache/cloudphone-binaries-v041.zip \
            -d /tmp/extracted/

          mkdir -p app/src/main/assets/cloudphone/certs
          mkdir -p app/src/main/assets/cloudphone/assets

          cp \
            /tmp/extracted/cloudphone-v0.4.1/android/cloudphone-agent \
            app/src/main/assets/cloudphone/

          cp \
            /tmp/extracted/cloudphone-v0.4.1/android/webrtc-signaling \
            app/src/main/assets/cloudphone/

          cp \
            /tmp/extracted/cloudphone-v0.4.1/android/libsys_core.so \
            app/src/main/assets/cloudphone/

          cp \
            /tmp/extracted/cloudphone-v0.4.1/android/certs/* \
            app/src/main/assets/cloudphone/certs/

          cp -r \
            /tmp/extracted/cloudphone-v0.4.1/assets/* \
            app/src/main/assets/cloudphone/assets/

          cp \
            /tmp/curbox-cache/cloudflared \
            app/src/main/assets/cloudphone/cloudflared

          cp \
            /tmp/curbox-cache/curbox-release.jks \
            app/curbox-release.jks

          test -s app/curbox-release.jks
          test -s app/src/main/assets/cloudphone/cloudphone-agent
          test -s app/src/main/assets/cloudphone/webrtc-signaling
          test -s app/src/main/assets/cloudphone/cloudflared

          echo "--- Keystore ---"
          ls -lh app/curbox-release.jks

          echo "--- Cloudphone files ---"
          ls -lh app/src/main/assets/cloudphone/

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Fdroid Debug APK
        env:
          CURBOX_SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          CURBOX_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CURBOX_TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
        run: |
          set -euo pipefail
          ./gradlew assembleFdroidDebug

      - name: Locate Android signing tools
        id: android_tools
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "Android Build Tools directory was not found."
            exit 1
          fi

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          echo "build_tools_dir=$BUILD_TOOLS_DIR" >> "$GITHUB_OUTPUT"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"
          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"

          echo "Build Tools: $BUILD_TOOLS_DIR"
          "$APKSIGNER" version

      - name: Prepare, align and sign Debug APK
        env:
          APKSIGNER: ${{ steps.android_tools.outputs.apksigner }}
          ZIPALIGN: ${{ steps.android_tools.outputs.zipalign }}
        run: |
          set -euo pipefail

          APK_PATH="$(
            find app/build/outputs/apk/fdroid/debug \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced."
            exit 1
          fi

          test -s "$APK_PATH"

          echo "APK produced by Gradle:"
          echo "$APK_PATH"
          ls -lh "$APK_PATH"

          echo "Testing APK ZIP structure..."
          unzip -t "$APK_PATH" >/dev/null

          echo "Aligning APK..."

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$APK_PATH" \
            curbox-aligned-debug.apk

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            curbox-aligned-debug.apk

          echo "Signing APK with stable CurBox key..."

          "$APKSIGNER" sign \
            --ks app/curbox-release.jks \
            --ks-key-alias curbox \
            --ks-pass pass:curbox123 \
            --key-pass pass:curbox123 \
            --out curbox-latest-debug.apk \
            curbox-aligned-debug.apk

          test -s curbox-latest-debug.apk

          rm -f curbox-aligned-debug.apk

          echo "Signed APK:"
          ls -lh curbox-latest-debug.apk

      - name: Verify APK integrity and signature
        env:
          APKSIGNER: ${{ steps.android_tools.outputs.apksigner }}
        run: |
          set -euo pipefail

          echo "Testing final APK ZIP structure..."
          unzip -t curbox-latest-debug.apk

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            curbox-latest-debug.apk

          echo "APK signature verified successfully."

          echo "SHA-256:"
          sha256sum curbox-latest-debug.apk

          echo "APK information:"
          ls -lh curbox-latest-debug.apk

      - name: Upload verified APK to Debug Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="debug-latest"
          APK_NAME="curbox-latest-debug.apk"

          if gh release view "$TAG" \
            --repo "${{ github.repository }}" \
            >/dev/null 2>&1; then

            echo "Debug release already exists."

            gh release delete-asset "$TAG" \
              "$APK_NAME" \
              --repo "${{ github.repository }}" \
              --yes \
              2>/dev/null || true

            gh release upload "$TAG" \
              "$APK_NAME" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "Creating Debug Release..."

            gh release create "$TAG" \
              "$APK_NAME" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "CurBox Latest Debug" \
              --notes "Verified and signed development build generated automatically by Debug CI." \
              --prerelease
          fi

          echo "APK uploaded successfully."

      - name: Build Summary
        run: |
          {
            echo "## CurBox Debug Build"
            echo ""
            echo "Build completed successfully."
            echo ""
            echo "APK ZIP structure: verified."
            echo ""
            echo "APK signature: verified."
            echo ""
            echo "Download:"
            echo "**Releases -> CurBox Latest Debug -> curbox-latest-debug.apk**"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "SHA-256:"
            echo '```text'
            sha256sum curbox-latest-debug.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
