name: Debug CI

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Scrcpy binaries from private repo
        env:
          GH_TOKEN: ${{ secrets.BINARIES_TOKEN }}
        run: |
          mkdir -p /tmp/extracted
          gh release download binaries-v041 \
            --repo mood-ahmad/curbox-scrcpy-binaries \
            --pattern "cloudphone-binaries-v041.zip" \
            --dir /tmp/
          unzip -o /tmp/cloudphone-binaries-v041.zip -d /tmp/extracted/

          # Set up clean assets/cloudphone structure
          mkdir -p app/src/main/assets/cloudphone/certs
          mkdir -p app/src/main/assets/cloudphone/assets

          # Copy binaries and libs
          cp /tmp/extracted/cloudphone-v0.4.1/android/cloudphone-agent app/src/main/assets/cloudphone/
          cp /tmp/extracted/cloudphone-v0.4.1/android/webrtc-signaling app/src/main/assets/cloudphone/
          cp /tmp/extracted/cloudphone-v0.4.1/android/libsys_core.so app/src/main/assets/cloudphone/

          # Copy certs
          cp /tmp/extracted/cloudphone-v0.4.1/android/certs/* app/src/main/assets/cloudphone/certs/

          # Copy web assets (everything inside the root assets folder)
          cp -r /tmp/extracted/cloudphone-v0.4.1/assets/* app/src/main/assets/cloudphone/assets/

          echo "--- Contents of assets/cloudphone: ---"
          find app/src/main/assets/cloudphone -maxdepth 2 -type d
          echo "--- Files: ---"
          ls -la app/src/main/assets/cloudphone/
          ls -la app/src/main/assets/cloudphone/certs/

      - name: Give permission to executable
        run: chmod +x gradlew

      - name: Build Fdroid Debug APK
        env:
          CURBOX_SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          CURBOX_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CURBOX_TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
        run: ./gradlew assembleFdroidDebug

      - name: Upload Fdroid Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-debug-apk
          path: app/build/outputs/apk/fdroid/debug
