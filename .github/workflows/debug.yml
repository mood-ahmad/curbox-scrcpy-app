name: Debug CI

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARIES_REPOSITORY: 'mood-ahmad/curbox-scrcpy-binaries'
  SCRCPY_RELEASE_TAG: 'binaries-v041-recovered-baseline'
  CLOUDFLARED_RELEASE_TAG: 'cloudflared-android-2026.10.5'
  CLOUDFLARED_EXPECTED_SHA256: 'b2980050c656458c4e3b1c35eda53d1c00d9b02edbb32ff55e37df318b5e657c'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache downloaded runtime dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/curbox-cache
          # التغيير الأول: غيرنا v1 إلى v2 عشان نكسر الكاش القديم
          key: curbox-runtime-baseline-cloudflared-android-2026.10.5-v2

      - name: Download pinned Scrcpy runtime and signing key
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BINARIES_TOKEN }}
        run: |
          set -euo pipefail

          CACHE_ROOT="/tmp/curbox-cache"
          SCRCPY_CACHE="$CACHE_ROOT/scrcpy-v041"

          SCRCPY_ZIP="$SCRCPY_CACHE/cloudphone-binaries-v041-recovered-baseline.zip"
          KEYSTORE="$SCRCPY_CACHE/curbox-release.jks"

          mkdir -p "$SCRCPY_CACHE"

          # التغيير التاني: ضفنا --clobber عشان يمسح أي نسخة قديمة وينزل الجديدة غصب عنه
          echo "Downloading baseline Scrcpy runtime..."

          gh release download "$SCRCPY_RELEASE_TAG" \
            --repo "$BINARIES_REPOSITORY" \
            --pattern "cloudphone-binaries-v041-recovered-baseline.zip" \
            --dir "$SCRCPY_CACHE" \
            --clobber

          if [ ! -s "$KEYSTORE" ]; then
            echo "Downloading CurBox signing key from stable release..."

            gh release download "binaries-v041" \
              --repo "$BINARIES_REPOSITORY" \
              --pattern "curbox-release.jks" \
              --dir "$SCRCPY_CACHE"
          fi

          test -s "$SCRCPY_ZIP"
          test -s "$KEYSTORE"

          echo "===== Scrcpy runtime download ====="
          ls -lh "$SCRCPY_ZIP"

      - name: Download verified Android cloudflared release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BINARIES_TOKEN }}
        run: |
          set -euo pipefail
          CACHE_ROOT="/tmp/curbox-cache"
          CLOUDFLARED_CACHE="$CACHE_ROOT/cloudflared-android-2026.10.5"

          CLOUDFLARED_BIN="$CLOUDFLARED_CACHE/cloudflared"
          CLOUDFLARED_SUMS="$CLOUDFLARED_CACHE/SHA256SUMS"
          CLOUDFLARED_INFO="$CLOUDFLARED_CACHE/build-info.txt"

          mkdir -p "$CLOUDFLARED_CACHE"

          if [ ! -s "$CLOUDFLARED_BIN" ] || \
             [ ! -s "$CLOUDFLARED_SUMS" ] || \
             [ ! -s "$CLOUDFLARED_INFO" ]; then

            echo "Downloading verified Android cloudflared release..."

            rm -f \
              "$CLOUDFLARED_BIN" \
              "$CLOUDFLARED_SUMS" \
              "$CLOUDFLARED_INFO"

            gh release download "$CLOUDFLARED_RELEASE_TAG" \
              --repo "$BINARIES_REPOSITORY" \
              --pattern "cloudflared" \
              --pattern "SHA256SUMS" \
              --pattern "build-info.txt" \
              --dir "$CLOUDFLARED_CACHE"
          fi

          test -s "$CLOUDFLARED_BIN"
          test -s "$CLOUDFLARED_SUMS"
          test -s "$CLOUDFLARED_INFO"

          cd "$CLOUDFLARED_CACHE"
          sha256sum -c SHA256SUMS

          ACTUAL_SHA256="$(sha256sum cloudflared | awk '{print $1}')"
          test "$ACTUAL_SHA256" = "$CLOUDFLARED_EXPECTED_SHA256"

      - name: Verify Android cloudflared identity
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARED_CACHE="/tmp/curbox-cache/cloudflared-android-2026.10.5"
          CLOUDFLARED_BIN="$CLOUDFLARED_CACHE/cloudflared"
          CLOUDFLARED_INFO="$CLOUDFLARED_CACHE/build-info.txt"

          file "$CLOUDFLARED_BIN" > /tmp/cloudflared-file-info.txt
          readelf -h "$CLOUDFLARED_BIN" > /tmp/cloudflared-elf-header.txt
          readelf -l "$CLOUDFLARED_BIN" > /tmp/cloudflared-program-headers.txt

          grep -Fq "ELF 64-bit" /tmp/cloudflared-file-info.txt
          grep -Fq "ARM aarch64" /tmp/cloudflared-file-info.txt
          grep -Fq "for Android 21" /tmp/cloudflared-file-info.txt
          grep -Fq "AArch64" /tmp/cloudflared-elf-header.txt
          grep -Fq "/system/bin/linker64" /tmp/cloudflared-program-headers.txt
          grep -Fq "cloudflared version: 2026.10.5" "$CLOUDFLARED_INFO"

      - name: Prepare verified CurBox runtime assets
        shell: bash
        run: |
          set -euo pipefail

          SCRCPY_CACHE="/tmp/curbox-cache/scrcpy-v041"
          CLOUDFLARED_CACHE="/tmp/curbox-cache/cloudflared-android-2026.10.5"

          EXTRACT_ROOT="/tmp/extracted"
          
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"

          unzip -q -o \
            "$SCRCPY_CACHE/cloudphone-binaries-v041-recovered-baseline.zip" \
            -d "$EXTRACT_ROOT"

          find "$EXTRACT_ROOT" -maxdepth 1 -name "*.zip" -exec unzip -q -o {} -d "$EXTRACT_ROOT" \;

          SOURCE_ROOT=$(find "$EXTRACT_ROOT" -maxdepth 2 -type d -name "android" -exec dirname {} \; | head -n 1)

          if [ -z "$SOURCE_ROOT" ]; then
            echo "Could not find 'android' directory!"
            ls -R "$EXTRACT_ROOT" | head -n 50
            exit 1
          fi

          ANDROID_SOURCE="$SOURCE_ROOT/android"
          WEB_ASSETS_SOURCE="$SOURCE_ROOT/assets"

          TARGET_ROOT="app/src/main/assets/cloudphone"
          TARGET_CERTS="$TARGET_ROOT/certs"
          TARGET_ASSETS="$TARGET_ROOT/assets"

          test -d "$ANDROID_SOURCE"
          test -d "$WEB_ASSETS_SOURCE"
          test -s "$ANDROID_SOURCE/cloudphone-agent"
          test -s "$ANDROID_SOURCE/webrtc-signaling"
          test -s "$ANDROID_SOURCE/libsys_core.so"
          test -d "$ANDROID_SOURCE/certs"

          rm -rf "$TARGET_ROOT"
          mkdir -p "$TARGET_CERTS" "$TARGET_ASSETS"

          cp "$ANDROID_SOURCE/cloudphone-agent" "$TARGET_ROOT/cloudphone-agent"
          cp "$ANDROID_SOURCE/webrtc-signaling" "$TARGET_ROOT/webrtc-signaling"
          cp "$ANDROID_SOURCE/libsys_core.so" "$TARGET_ROOT/libsys_core.so"
          cp -a "$ANDROID_SOURCE/certs/." "$TARGET_CERTS/"
          cp -a "$WEB_ASSETS_SOURCE/." "$TARGET_ASSETS/"
          cp "$CLOUDFLARED_CACHE/cloudflared" "$TARGET_ROOT/cloudflared"
          cp "$SCRCPY_CACHE/curbox-release.jks" app/curbox-release.jks
          chmod 755 "$TARGET_ROOT/cloudflared"

          # التغيير التالت: هنطبع البصمة هنا عشان نتأكد في اللوج إن الملف اللي دخل هو الجديد
          echo "=== SHA-256 of the NEW webrtc-signaling being packaged ==="
          sha256sum "$TARGET_ROOT/webrtc-signaling"
          ls -lh "$TARGET_ROOT/webrtc-signaling"

      - name: Verify prepared CurBox runtime assets
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ROOT="app/src/main/assets/cloudphone"
          test -s app/curbox-release.jks
          test -s "$TARGET_ROOT/cloudphone-agent"
          test -s "$TARGET_ROOT/webrtc-signaling"
          test -s "$TARGET_ROOT/libsys_core.so"
          test -s "$TARGET_ROOT/cloudflared"
          test -d "$TARGET_ROOT/certs"
          test -d "$TARGET_ROOT/assets"

          CLOUDFLARED_SHA256="$(sha256sum "$TARGET_ROOT/cloudflared" | awk '{print $1}')"
          test "$CLOUDFLARED_SHA256" = "$CLOUDFLARED_EXPECTED_SHA256"

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew

      - name: Build Fdroid Debug APK
        shell: bash
        env:
          CURBOX_SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          CURBOX_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CURBOX_TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
          CURBOX_COMMAND_EMAIL: ${{ secrets.CURBOX_COMMAND_EMAIL }}
          CURBOX_COMMAND_PASSWORD: ${{ secrets.CURBOX_COMMAND_PASSWORD }}
          CURBOX_AUTHORIZED_COMMAND_SENDER: ${{ secrets.CURBOX_AUTHORIZED_COMMAND_SENDER }}
        run: |
          set -euo pipefail
          ./gradlew assembleFdroidDebug

      - name: Locate unsigned Fdroid Debug APK
        id: unsigned_apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/fdroid/debug -type f -name "*.apk" | sort)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one unsigned Fdroid Debug APK. Found: ${#APKS[@]}"
            exit 1
          fi
          APK_PATH="${APKS[0]}"
          test -s "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Locate Android signing tools
        id: android_tools
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"
          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"

      - name: Prepare, align and sign Debug APK
        shell: bash
        env:
          APKSIGNER: ${{ steps.android_tools.outputs.apksigner }}
          ZIPALIGN: ${{ steps.android_tools.outputs.zipalign }}
          APK_PATH: ${{ steps.unsigned_apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          "$ZIPALIGN" -p -f 4 "$APK_PATH" curbox-aligned-debug.apk
          "$APKSIGNER" sign --ks app/curbox-release.jks --ks-key-alias curbox --ks-pass pass:curbox123 --key-pass pass:curbox123 --out curbox-latest-debug.apk curbox-aligned-debug.apk
          rm -f curbox-aligned-debug.apk

      - name: Upload verified APK to Debug Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="debug-latest"
          APK_NAME="curbox-latest-debug.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            gh release upload "$TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CurBox Latest Debug" --prerelease
          fi
