name: Debug CI

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Scrcpy binaries from private repo
        run: |
          mkdir -p app/src/main/assets/cloudphone
          curl -fL \
            -H "Authorization: token ${{ secrets.BINARIES_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/cloudphone-binaries-v041.zip \
            "https://github.com/mood-ahmad/curbox-scrcpy-binaries/releases/download/binaries-v041/cloudphone-binaries-v041.zip"
          unzip -o /tmp/cloudphone-binaries-v041.zip -d app/src/main/assets/cloudphone/
          echo "--- Contents of assets/cloudphone: ---"
          ls -la app/src/main/assets/cloudphone/

      - name: Give permission to executable
        run: chmod +x gradlew

      - name: Build Fdroid Debug APK
        run: ./gradlew assembleFdroidDebug

      - name: Upload Fdroid Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-debug-apk
          path: app/build/outputs/apk/fdroid/debug
